<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF0F2"/>
      <stop offset="100%" stop-color="#E1E3E6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- pipeline nodes -->
  <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#5C6470">
    <rect x="70" y="260" width="130" height="70" rx="4" fill="#F7F7F8" stroke="#5C6470"/>
    <text x="100" y="300">RAW DATA</text>

    <rect x="260" y="260" width="130" height="70" rx="4" fill="#F7F7F8" stroke="#5C6470"/>
    <text x="270" y="292">PYTHON</text>
    <text x="270" y="308">(Pandas)</text>

    <rect x="450" y="260" width="130" height="70" rx="4" fill="#F7F7F8" stroke="#5C6470"/>
    <text x="465" y="292">POWER</text>
    <text x="465" y="308">QUERY</text>

    <rect x="630" y="260" width="110" height="70" rx="4" fill="#A9793F" opacity="0.9"/>
    <text x="650" y="300" fill="#F7F7F8">DASHBOARD</text>
  </g>

  <!-- arrows -->
  <g stroke="#1B2430" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="295" x2="255" y2="295"/>
    <line x1="390" y1="295" x2="445" y2="295"/>
    <line x1="580" y1="295" x2="625" y2="295"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1B2430"/>
    </marker>
  </defs>

  <!-- small bars under dashboard to suggest chart -->
  <g fill="#F7F7F8" opacity="0.9">
    <rect x="645" y="335" width="12" height="30"/>
    <rect x="663" y="325" width="12" height="40"/>
    <rect x="681" y="315" width="12" height="50"/>
    <rect x="699" y="305" width="12" height="60"/>
    <rect x="717" y="295" width="12" height="70"/>
  </g>

  <text x="70" y="120" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="1.5" fill="#A9793F">DATA PIPELINE — 75% TIME SAVED</text>
  <text x="70" y="540" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5C6470">SAMPLE VISUAL — NOT ACTUAL DATA</text>
</svg>
